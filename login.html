<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SmartDrink</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.2/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-white">
  <nav class="bg-white shadow px-4 py-2">
    <ul class="flex gap-4 text-lg">
      <li><a href="index.html" class="hover:underline">Inicio</a></li>
      <li><a href="servicios.html" class="hover:underline">Servicios</a></li>
      <li><a href="productos.html" class="hover:underline">Productos</a></li>
      <li><a href="nosotros.html" class="hover:underline">Nosotros</a></li>
    </ul>
  </nav>

  <main class="max-w-md mx-auto p-6">
    <h1 class="text-3xl font-bold mb-4 text-center">Inicia sesión</h1>
    <form class="space-y-4">
      <div>
        <label class="block mb-1">Correo electrónico</label>
        <input type="email" class="w-full border rounded p-2" placeholder="correo@example.com">
      </div>
      <div>
        <label class="block mb-1">Contraseña</label>
        <input type="password" class="w-full border rounded p-2" placeholder="********">
      </div>
      <button class="bg-black text-white px-4 py-2 rounded w-full">Entrar</button>
    </form>
    <p class="text-center mt-4 text-sm">No tienes cuenta? <a href="register.html" class="underline">Regístrate</a></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
