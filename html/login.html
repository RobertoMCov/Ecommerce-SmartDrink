<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDrink - Iniciar sesión</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white">
  <!-- Navbar -->
  <!--#include file="navbar.html" -->

  <section class="flex flex-wrap lg:h-[90vh] lg:items-center">
    <div class="w-full px-4 py-12 lg:w-1/2 lg:px-8 lg:py-24">
      <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-center">Inicia Sesión en SmartDrink</h1>
        <form class="space-y-4">
          <div>
            <input type="email" placeholder="Ingresa tu correo electrónico" class="w-full rounded-lg border-gray-200 p-4 text-sm shadow-sm" />
          </div>
          <div>
            <input type="password" placeholder="Ingresa tu contraseña" class="w-full rounded-lg border-gray-200 p-4 text-sm shadow-sm" />
          </div>
          <div class="flex items-center justify-between">
            <p class="text-sm text-gray-500">¿No tienes cuenta? <a href="registro.html" class="underline">Regístrate aquí</a></p>
            <button class="inline-block bg-black text-white rounded-lg px-5 py-3 text-sm">Iniciar Sesión</button>
          </div>
        </form>
      </div>
    </div>
    <div class="relative h-64 w-full lg:h-full lg:w-1/2">
      <img src="https://cdn.foodandwineespanol.com/2018/11/coctel.jpg" alt="Bebida" class="absolute inset-0 h-full w-full object-cover" />
    </div>
  </section>

  <!-- Footer -->
  <!--#include file="footer.html" -->
</body>
</html>
