<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDrink - Registro</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white">
  <!-- Navbar -->
  <!--#include file="navbar.html" -->

  <section class="bg-white">
    <div class="lg:grid lg:min-h-screen lg:grid-cols-12">
      <aside class="relative hidden lg:block lg:col-span-5 xl:col-span-6">
        <img src="https://www.my-vb.com/sites/default/files/styles/image_art/public/2019-05/M%C3%A9tier%20-%20Barman.jpg?itok=Km0Uj04v" class="absolute inset-0 h-full w-full object-cover" alt="" />
      </aside>
      <main class="flex items-center justify-center px-8 py-8 sm:px-12 lg:col-span-7 lg:px-16 lg:py-12 xl:col-span-6">
        <div class="max-w-xl lg:max-w-3xl w-full">
          <h1 class="text-2xl font-bold mb-4">Crea tu cuenta en SmartDrink</h1>
          <form class="grid grid-cols-6 gap-6">
            <div class="col-span-6 sm:col-span-3">
              <label class="block text-sm font-medium text-gray-700">Nombre(s)</label>
              <input type="text" class="mt-1 w-full rounded-md border-gray-200 p-2 text-sm" />
            </div>
            <div class="col-span-6 sm:col-span-3">
              <label class="block text-sm font-medium text-gray-700">Apellido paterno</label>
              <input type="text" class="mt-1 w-full rounded-md border-gray-200 p-2 text-sm" />
            </div>
            <div class="col-span-6 sm:col-span-3">
              <label class="block text-sm font-medium text-gray-700">Apellido materno</label>
              <input type="text" class="mt-1 w-full rounded-md border-gray-200 p-2 text-sm" />
            </div>
            <div class="col-span-6 sm:col-span-3">
              <label class="block text-sm font-medium text-gray-700">Fecha de nacimiento</label>
              <input type="date" class="mt-1 w-full rounded-md border-gray-200 p-2 text-sm" />
            </div>
            <div class="col-span-6">
              <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
              <input type="email" class="mt-1 w-full rounded-md border-gray-200 p-2 text-sm" />
            </div>
            <div class="col-span-6 sm:col-span-3">
              <label class="block text-sm font-medium text-gray-700">Contraseña</label>
              <input type="password" class="mt-1 w-full rounded-md border-gray-200 p-2 text-sm" />
            </div>
            <div class="col-span-6 sm:col-span-3">
              <label class="block text-sm font-medium text-gray-700">Confirmar contraseña</label>
              <input type="password" class="mt-1 w-full rounded-md border-gray-200 p-2 text-sm" />
            </div>
            <div class="col-span-6 sm:flex sm:items-center sm:gap-4">
              <button class="inline-block bg-black text-white rounded-md px-8 py-3 text-sm">Registrarme</button>
              <p class="mt-4 text-sm text-gray-500 sm:mt-0">¿Ya tienes cuenta? <a href="login.html" class="underline">Iniciar sesión</a></p>
            </div>
          </form>
        </div>
      </main>
    </div>
  </section>

  <!-- Footer -->
  <!--#include file="footer.html" -->
</body>
</html>
