<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartDrink - Checkout</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-white">
  <!-- Navbar -->
  <!--#include file="navbar.html" -->

  <section class="max-w-5xl mx-auto px-4 py-12">
    <h1 class="sr-only">Checkout</h1>
    <div class="grid md:grid-cols-2 gap-8">
      <div>
        <h2 class="text-xl font-medium mb-4">Resumen de compra</h2>
        <ul class="space-y-4">
          <li class="flex items-center gap-4">
            <img src="../src/assets/Drinker.png" alt="" class="h-16 w-16 rounded object-fill" />
            <div>
              <h3 class="text-sm">Dispensador SmartDrink</h3>
              <p class="text-sm text-gray-600">Cantidad: 1</p>
            </div>
            <p class="ml-auto font-medium">$29,999</p>
          </li>
        </ul>
      </div>
      <div>
        <form class="grid grid-cols-6 gap-4">
          <div class="col-span-3">
            <label class="block text-sm font-medium text-gray-700">Nombre(s)</label>
            <input type="text" class="mt-2 w-full border rounded-md p-2" />
          </div>
          <div class="col-span-3">
            <label class="block text-sm font-medium text-gray-700">Apellido paterno</label>
            <input type="text" class="mt-2 w-full border rounded-md p-2" />
          </div>
          <div class="col-span-3">
            <label class="block text-sm font-medium text-gray-700">Apellido materno</label>
            <input type="text" class="mt-2 w-full border rounded-md p-2" />
          </div>
          <div class="col-span-3">
            <label class="block text-sm font-medium text-gray-700">Teléfono</label>
            <input type="tel" class="mt-2 w-full border rounded-md p-2" />
          </div>
          <div class="col-span-6">
            <label class="block text-sm font-medium text-gray-700">Correo electrónico</label>
            <input type="email" class="mt-2 w-full border rounded-md p-2" />
          </div>
          <div class="col-span-6">
            <label class="block text-sm font-medium text-gray-700">Dirección de envío</label>
            <textarea rows="4" class="mt-2 w-full border rounded-md p-2"></textarea>
          </div>
          <div class="col-span-6">
            <button class="w-full bg-black text-white py-2 rounded-md hover:bg-white hover:text-black border hover:border-black">Terminar orden</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <!--#include file="footer.html" -->
</body>
</html>
